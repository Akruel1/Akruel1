<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title">
  <title id="title">Selected work</title>
  <defs>
    <style><![CDATA[
      .display {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.055em;
      }
      .mono {
        font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
        font-weight: 500;
        letter-spacing: 0.14em;
      }
      .body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .slide {
        animation: slide 5s ease-in-out infinite;
      }
      @keyframes slide {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(24px); }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="180" fill="#101010"/>
  <rect x="0" y="0" width="1200" height="6" fill="#E8FF3D"/>
  <text x="48" y="48" class="mono" fill="#E8FF3D" font-size="13">CAMPAIGNS</text>
  <text x="48" y="112" class="display" fill="#F0EEE8" font-size="64">SELECTED WORK</text>
  <text x="48" y="152" class="body" fill="#B8BABD" font-size="20">Two campaigns. Architecture without the SaaS costume.</text>
  <rect class="slide" x="980" y="72" width="140" height="8" fill="#E7352B"/>
  <rect x="1136" y="64" width="24" height="24" fill="#244BFF"/>
</svg>
