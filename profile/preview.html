<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub profile README preview — continuous sequence</title>
  <style>
    :root {
      --gh-bg: #0d1117;
      --gh-panel: #161b22;
      --gh-border: #30363d;
      --gh-mute: #8b949e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--gh-bg);
      color: #e6edf3;
    }
    .shell { max-width: 1012px; margin: 32px auto; padding: 0 16px 64px; }
    .label {
      color: var(--gh-mute);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0 0 12px;
    }
    .card {
      background: var(--gh-panel);
      border: 1px solid var(--gh-border);
      border-radius: 6px;
      padding: 16px;
    }
    .card img.full { width: 100%; height: auto; display: block; margin: 0 0 10px; }
    .nav { text-align: center; margin: 4px 0 14px; }
    .nav img { height: 44px; margin: 4px; vertical-align: middle; }
    .portrait { display: block; width: 240px; margin: 8px auto 14px; }
    .mobile { max-width: 390px; margin: 48px auto 0; }
    .mobile .portrait { width: 160px; }
    .mobile .nav img { height: 34px; margin: 3px; }
  </style>
</head>
<body>
  <div class="shell" id="desktop">
    <div class="label">Continuous SVG profile · desktop</div>
    <div class="card">
      <img class="full" src="./banner.svg" alt="" />
      <div class="nav">
        <img src="./nav-portfolio.svg" alt="Portfolio" />
        <img src="./nav-linkedin.svg" alt="LinkedIn" />
        <img src="./nav-telegram.svg" alt="Telegram" />
        <img src="./nav-email.svg" alt="Email" />
      </div>
      <img class="portrait" src="./portrait.jpg" alt="" />
      <img class="full" src="./identity.svg" alt="" />
      <img class="full" src="./work-header.svg" alt="" />
      <img class="full" src="./arax.svg" alt="" />
      <img class="full" src="./orbox.svg" alt="" />
      <img class="full" src="./focus.svg" alt="" />
      <img class="full" src="./footer.svg" alt="" />
    </div>
  </div>

  <div class="shell mobile" id="mobile">
    <div class="label">Continuous SVG profile · mobile ~390px</div>
    <div class="card">
      <img class="full" src="./banner.svg" alt="" />
      <div class="nav">
        <img src="./nav-portfolio.svg" alt="" />
        <img src="./nav-linkedin.svg" alt="" />
        <img src="./nav-telegram.svg" alt="" />
        <img src="./nav-email.svg" alt="" />
      </div>
      <img class="portrait" src="./portrait.jpg" alt="" />
      <img class="full" src="./identity.svg" alt="" />
      <img class="full" src="./work-header.svg" alt="" />
      <img class="full" src="./arax.svg" alt="" />
      <img class="full" src="./orbox.svg" alt="" />
      <img class="full" src="./focus.svg" alt="" />
      <img class="full" src="./footer.svg" alt="" />
    </div>
  </div>
</body>
</html>
