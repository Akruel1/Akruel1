<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-hidden="true">
  <defs>
    <style><![CDATA[
      .m {
        animation: move 6s ease-in-out infinite;
      }
      @keyframes move {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(160px); }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="24" fill="#101010"/>
  <rect x="0" y="10" width="1200" height="1" fill="#B8BABD" opacity="0.35"/>
  <rect class="m" x="40" y="7" width="72" height="7" fill="#E8FF3D"/>
  <rect x="1120" y="7" width="7" height="7" fill="#E7352B"/>
  <rect x="1134" y="7" width="7" height="7" fill="#244BFF"/>
</svg>
