  <text x="64" y="100" class="display" fill="#101010" font-size="42">ANDREY TESSA</text>
  <text x="520" y="96" class="mono" fill="#244BFF" font-size="14">AI SYSTEMS ENGINEER</text>
  <text x="860" y="96" class="mono" fill="#101010" font-size="13">&#x410;&#x41D;&#x414;&#x420;&#x415;&#x419; &#x422;&#x415;&#x421;&#x421;&#x410;</text>
