  <defs>
    <style><![CDATA[
      .display {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.05em;
      }
      .mono {
        font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
        font-weight: 500;
        letter-spacing: 0.14em;
      }
      .pulse {
