<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">Orbox - AI inside operational workflows</title>
  <defs>
    <style><![CDATA[
      .display {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.06em;
      }
      .mono {
        font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
        font-weight: 500;
        letter-spacing: 0.12em;
      }
      .body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .dash {
        stroke-dasharray: 12 10;
        animation: dash 3.2s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: -88; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="360" fill="#F0EEE8"/>
  <rect x="0" y="0" width="18" height="360" fill="#E7352B"/>
  <rect x="0" y="352" width="1200" height="8" fill="#101010"/>
  <text x="56" y="42" class="mono" fill="#E7352B" font-size="13">CAMPAIGN 02</text>
  <text x="56" y="140" class="display" fill="#101010" font-size="110">ORBOX</text>
  <text x="56" y="186" class="body" fill="#101010" font-size="22">AI inside operational workflows</text>
  <line class="dash" x1="56" y1="208" x2="360" y2="208" stroke="#244BFF" stroke-width="4"/>
  <text x="56" y="260" class="body" fill="#101010" font-size="18" opacity="0.88">Applied AI solutions and workflow automation -</text>
  <text x="56" y="288" class="body" fill="#101010" font-size="18" opacity="0.88">models wired into real processes where boundaries,</text>
  <text x="56" y="316" class="body" fill="#101010" font-size="18" opacity="0.88">retries, and human checkpoints are first-class.</text>
  <g transform="translate(1120,330) rotate(-90)">
    <text class="mono" fill="#101010" font-size="12" opacity="0.7">BOUNDARIES / RETRIES / CHECKPOINTS</text>
  </g>
  <rect x="980" y="36" width="172" height="172" fill="#E7352B"/>
  <text x="1024" y="136" class="display" fill="#F0EEE8" font-size="42">02</text>
</svg>
