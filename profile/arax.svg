<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">ARAX - Enterprise AI Knowledge Platform</title>
  <defs>
    <style><![CDATA[
      .display {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.06em;
      }
      .mono {
        font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
        font-weight: 500;
        letter-spacing: 0.12em;
      }
      .body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .bar {
        animation: grow 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        transform-origin: 48px 214px;
      }
      @keyframes grow {
        0%, 100% { transform: scaleX(0.35); }
        50% { transform: scaleX(1); }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="360" fill="#244BFF"/>
  <rect x="0" y="0" width="1200" height="8" fill="#101010"/>
  <text x="48" y="42" class="mono" fill="#E8FF3D" font-size="13">CAMPAIGN 01</text>
  <text x="48" y="140" class="display" fill="#F0EEE8" font-size="110">ARAX</text>
  <text x="48" y="186" class="body" fill="#F0EEE8" font-size="22">Enterprise AI Knowledge Platform</text>
  <rect class="bar" x="48" y="204" width="280" height="6" fill="#E8FF3D"/>
  <text x="48" y="260" class="body" fill="#F0EEE8" font-size="18" opacity="0.92">A platform concept for enterprise knowledge -</text>
  <text x="48" y="288" class="body" fill="#F0EEE8" font-size="18" opacity="0.92">ingest, embed, retrieve, and answer through controlled surfaces.</text>
  <text x="48" y="322" class="mono" fill="#E8FF3D" font-size="13">INFRASTRUCTURE, NOT A CHATBOT WRAPPER</text>
  <g transform="translate(1120,330) rotate(-90)">
    <text class="mono" fill="#F0EEE8" font-size="12" opacity="0.8">INGEST / EMBED / RETRIEVE / ANSWER</text>
  </g>
  <rect x="980" y="36" width="172" height="172" fill="none" stroke="#F0EEE8" stroke-width="2" opacity="0.35"/>
  <rect x="1010" y="66" width="112" height="112" fill="#101010" opacity="0.25"/>
  <text x="1032" y="136" class="display" fill="#F0EEE8" font-size="42">01</text>
</svg>
